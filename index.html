<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#8b5cf6" />
  <title>大富翁之金聪明游浙江</title>
  <link rel="stylesheet" href="styles.css?v=1.4" />
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
  <script>
    window.addEventListener("error", function (e) {
      console.error("页面错误", e.message, e.filename, e.lineno);
      try {
        var el = document.getElementById("toast");
        if (el) { el.textContent = "页面出错：" + e.message; el.classList.add("show"); }
      } catch (err) {}
    });
  </script>
</head>
<body>
  <div id="home" class="screen">
    <div class="home-inner">
      <div class="game-logo">🗺️</div>
      <h1 class="game-title">大富翁之金聪明游浙江</h1>
      <p class="game-sub">多人联机大富翁 · 游历浙江 12 城</p>
      <p class="conn-status" id="connStatus">正在连接云端…</p>
      <div class="home-card">
        <div class="field">
          <span>选择头像</span>
          <div id="avatarRow" class="avatar-row"></div>
        </div>
        <label class="field">
          <span>你的昵称</span>
          <input id="inName" type="text" maxlength="12" placeholder="输入昵称" />
        </label>
        <button class="btn btn-primary btn-lg" id="btnCreate">创建房间</button>
        <button class="btn btn-ghost btn-block" id="btnRules">📖 游戏规则</button>
        <div class="divider">或</div>
        <div class="join-row">
          <input id="inCode" type="text" maxlength="4" placeholder="房间号" style="text-transform:uppercase" />
          <button class="btn btn-ghost" id="btnJoin">加入房间</button>
        </div>
        <div id="reconnect" class="reconnect hidden">
          <span>检测到上次未结束的游戏</span>
          <button class="btn btn-ghost btn-sm" id="btnReconnect">重新连接</button>
        </div>
      </div>
      <p class="home-note">已接入腾讯云实时联机：手机和电脑输入同一房间号即可一起玩，首次进入稍等 1~2 秒完成连接。</p>
    </div>
  </div>

  <div id="room" class="screen hidden">
    <div class="room-inner">
      <div class="room-head">
        <button class="btn btn-back" id="btnLeave">← 退出</button>
        <div class="room-code-wrap">
          <div class="room-code-label">房间号</div>
          <div class="room-code" id="roomCode">—</div>
        </div>
        <button class="btn btn-ghost btn-sm" id="btnCopyCode">复制</button>
      </div>
      <div class="card">
        <h3 class="sec-title">玩家（<span id="playerCount">0</span>/<span id="maxPlayers">6</span>）</h3>
        <div id="roomPlayers" class="room-players"></div>
      </div>
      <div class="card" id="hostSettingsCard">
        <h3 class="sec-title">房间设置（房主）</h3>
        <label class="set-row"><span>初始资金</span><input id="setMoney" type="number" min="1000" max="100000" step="1000" class="set-input" /></label>
        <label class="set-row"><span>玩家上限</span><select id="setMax" class="set-input"><option>2</option><option>3</option><option>4</option><option>5</option><option selected>6</option></select></label>
        <label class="set-row"><span>开局特殊卡牌</span><select id="setCards" class="set-input"><option selected>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
        <label class="set-row"><span>同城收益加成</span><select id="setCityBonus" class="set-input"><option value="0.2" selected>+0.2</option><option value="0.3">+0.3</option><option value="0.4">+0.4</option><option value="0.5">+0.5</option></select></label>
        <label class="set-row"><span>经过起点奖励</span><select id="setStartReward" class="set-input"><option value="3000" selected>¥3000</option><option value="5000">¥5000</option><option value="10000">¥10000</option><option value="2000">¥2000</option></select></label>
        <label class="set-row"><span>增加电脑玩家</span><select id="setAI" class="set-input"><option value="0" selected>0 个</option><option value="1">1 个</option><option value="2">2 个</option><option value="3">3 个</option><option value="4">4 个</option><option value="5">5 个</option></select></label>
        <label class="set-row"><span>音效</span><select id="setSound" class="set-input"><option value="1" selected>开</option><option value="0">关</option></select></label>
        <label class="set-row"><span>动画速度</span><select id="setAnim" class="set-input"><option value="fast" selected>快</option><option value="normal">正常</option></select></label>
      </div>
      <button class="btn btn-primary btn-lg btn-block" id="btnStart" disabled>开始游戏</button>
    </div>
  </div>

  <div id="game" class="screen hidden">
    <div class="hud">
      <div class="hud-left">
        <span class="hud-code" id="hudCode">—</span>
        <button class="icon-btn" id="btnBgm" title="背景音乐">🎵</button>
        <button class="icon-btn" id="btnNext" title="下一首">⏭</button>
        <button class="icon-btn" id="btnSound" title="音效">🔊</button>
        <button class="icon-btn" id="btnLog" title="记录">📜</button>
        <button class="icon-btn" id="btnAiManage" title="AI托管" style="font-size:11px;width:auto;padding:0 9px;">🤖托管</button>
      </div>
      <div class="hud-mid">
        <div class="hud-turn" id="hudTurn">—</div>
        <div class="bgm-name" id="bgmName"></div>
        <div class="hud-newtown" id="hudNewtown"></div>
      </div>
      <button class="btn btn-ghost btn-sm" id="btnExitGame">退出</button>
    </div>
    <div id="boardWrap" class="board-wrap">
      <div id="board" class="board">
        <div id="pieceLayer" class="piece-layer"></div>
      </div>
    </div>
    <div id="bigDice" class="big-dice hidden"></div>
    <div id="bigDiceName" class="big-dice-name hidden"></div>
    <div id="bigEvent" class="big-event hidden"></div>
    <div id="players" class="players"></div>
    <div id="chatPanel" class="chat-panel">
      <div class="chat-title">💬 聊天室</div>
      <div id="chatList" class="chat-list"></div>
      <div class="chat-input-row">
        <input id="chatInput" type="text" maxlength="120" placeholder="输入聊天内容…" autocomplete="off" />
        <button class="btn btn-sm" id="btnChatSend">发送</button>
      </div>
    </div>
    <div id="actionbar" class="actionbar"></div>
    <button id="endTurnBtn" class="end-turn-btn hidden">✅ 结束回合</button>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head"><span id="modalTitle">提示</span><button class="icon-btn" id="modalClose">✕</button></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <div class="version-footer">大富翁之金聪明游浙江 · v1.2</div>

  <script src="data.js?v=1.4"></script>
  <script src="engine.js?v=1.4"></script>
  <script src="app.js?v=1.4"></script>
</body>
</html>
